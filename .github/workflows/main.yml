name: Build LuaJIT

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 32-bit dependencies
        if: matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Build (x86_64)
        if: matrix.arch == 'x86_64'
        run: make -j$(nproc)

      - name: Build (x86)
        if: matrix.arch == 'x86'
        run: make -j$(nproc) CC="gcc -m32"

      - name: Verify binary
        run: |
          ./src/luajit -v
          ./src/luajit -e "print('Hello from LuaJIT!')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luajit-linux-${{ matrix.arch }}
          path: src/luajit
          if-no-files-found: error

  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make -j$(sysctl -n hw.logicalcpu)
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"

      - name: Verify binary
        run: |
          ./src/luajit -v
          ./src/luajit -e "print('Hello from LuaJIT!')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luajit-macos-${{ matrix.arch }}
          path: src/luajit
          if-no-files-found: error

  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSVC to PATH
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        working-directory: src
        shell: cmd
        run: msvcbuild.bat

      - name: Verify binary
        working-directory: src
        shell: cmd
        run: |
          luajit.exe -v
          luajit.exe -e "print('Hello from LuaJIT!')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luajit-windows-x86_64
          path: |
            src/luajit.exe
            src/lua51.dll
          if-no-files-found: error

  release:
    name: Publish Release
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2.1'
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get short SHA
        id: version
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          cd artifacts
          for dir in */; do
            zip -r "${dir%/}.zip" "$dir"
          done

      - name: Delete existing rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-build --yes || true
          git push --delete origin latest-build || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Latest Build (${{ steps.version.outputs.sha }})"
          body: |
            Automated release built from the latest commit.

            **Branch:** `${{ github.ref_name }}`
            **Commit:** ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          files: artifacts/*.zip
          prerelease: false
          draft: false
          make_latest: true
